[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotruth-policyci"
version = "0.0.1"
description = "Policy CI: deterministic scenario batteries, policy runs in simulation, and evidence-grade regression detection for robot policies. Built on robotruth."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "robotruth",
    "numpy",
    "pydantic>=2",
]

[project.optional-dependencies]
aloha = [
    "gymnasium",
    "gym-aloha",
    "torch",
    "lerobot",
    "safetensors",
    "huggingface_hub",
    "imageio[ffmpeg]",
]
dev = ["pytest"]

[project.scripts]
policyci = "policyci.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/policyci"]
