[project]
name = "robotruth"
version = "0.1.0"
description = "Robot CI: tells a robot lab whether a policy change is real. Contract checks, honest statistics, drift fingerprints and calibrated outcome judging for learned robot policies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "robotruth contributors" }]
keywords = ["robotics", "evaluation", "vla", "statistics", "lerobot", "ci"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mcap>=1.1"]
mcap = ["mcap>=1.1"]

[project.scripts]
robotruth = "robotruth.cli:app"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robotruth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
